ext><rect x="380" y="-60" width="450" height="130" fill="#B2C9AB" stroke="#999" stroke-width="1"/><text x="605" y="86" font-family="sans-serif" font-size="12" fill="#46495D" text-anchor="middle">one-build-blueprint&lt;br&gt;(功能蓝图/白盒文档，调用自由，格式自由，可以直接基于该文档开发，此乃白盒的关键，人工控制，介绍这个项目是干啥的，啥都在哪，既有功能视图，又有map粗略能力，代码是最好的知识库，所以本技能主要是在代码前，让人和agent能大略了解代码项目，比如三个目录是我们现在用的，old里面是以前旧流程，这种东西不人工写，AI永远不知道，别人看了也不知道，代码只反映了所有目录有啥功能，不知道你的old原来竟然是旧的啊，用来供新的参考呢。&lt;br&gt;)</text><rect x="178.34" y="30" width="170" height="40" fill="#B2C9AB" stroke="#999" stroke-width="1"/><text x="263.34000000000003" y="86" font-family="sans-serif" font-size="12" fill="#46495D" text-anchor="middle">one-grill-with-docs-prd&lt;br&gt;(交互式需求 Grilling 与分析)</text><rect x="173.84" y="109" width="180" height="40" fill="#B2C9AB" stroke="#999" stroke-width="1"/><text x="263.84000000000003" y="165" font-family="sans-serif" font-size="12" fill="#46495D" text-anchor="middle">产出文档
(CONTEXT.md / ADR / PRD)</text><rect x="170.49999999999997" y="193" width="140" height="30" fill="#B2C9AB" stroke="#999" stroke-width="1"/><text x="240.49999999999997" y="239" font-family="sans-serif" font-size="12" fill="#46495D" text-anchor="middle">用户确认/阅读 PRD？</text><rect x="155.5" y="260" width="170" height="122" fill="#B2C9AB" stroke="#999" stroke-width="1"/><text x="240.5" y="398" font-family="sans-serif" font-size="12" fill="#46495D" text-anchor="middle">one-implement 使用aaa触发&lt;div&gt;是否refactor&lt;/div&gt;</text><rect x="19.999999999999986" y="402.5" width="210" height="55" fill="#B2C9AB" stroke="#999" stroke-width="1"/><text x="124.99999999999999" y="473.5" font-family="sans-serif" font-size="12" fill="#46495D" text-anchor="middle">one-refactor-implement&lt;div&gt;让llm使用复制粘贴方式写代码，防止模型自己理解代码重新写出一个怪物出来&lt;/div&gt;</text><rect x="300" y="410" width="170" height="40" fill="#B2C9AB" stroke="#999" stroke-width="1"/><text x="385" y="466" font-family="sans-serif" font-size="12" fill="#46495D" text-anchor="middle">one-minimal-implement&lt;div&gt;让llm最小化实施，别乱加戏&lt;/div&gt;</text><rect x="209.99999999999997" y="570" width="80" height="30" fill="#B2C9AB" stroke="#999" stroke-width="1"/><text x="249.99999999999997" y="616" font-family="sans-serif" font-size="12" fill="#46495D" text-anchor="middle">matt/&lt;div&gt;codereview&lt;/div&gt;</text><rect x="465" y="160" width="305" height="50" fill="#B2C9AB" stroke="#999" stroke-width="1"/><text x="617.5" y="226" font-family="sans-serif" font-size="12" fill="#46495D" text-anchor="middle">one-handoff&lt;br&gt;产出交接文档，供下个会话使用，区别于matt的，这一版将交接文档放到项目根目录而非matt放到系统目录。</text><rect x="470" y="250" width="310" height="55" fill="#B2C9AB" stroke="#999" stroke-width="1"/><text x="625" y="321" font-family="sans-serif" font-size="12" fill="#46495D" text-anchor="middle">one-python-structure&lt;br&gt;python目录结构，个人python程序的框架习惯</text><rect x="490" y="340" width="300" height="55" fill="#B2C9AB" stroke="#999" stroke-width="1"/><text x="640" y="411" font-family="sans-serif" font-size="12" fill="#46495D" text-anchor="middle">one-simplifying&lt;br&gt;简化代码，里面有反例，有正面引导等。</text><rect x="490" y="430" width="300" height="55" fill="#B2C9AB" stroke="#999" stroke-width="1"/><text x="640" y="501" font-family="sans-serif" font-size="12" fill="#46495D" text-anchor="middle">one-llmwiki-skill&lt;br&gt;一个个人知识库，可以自己设计，不依赖任何东西&lt;br&gt;</text><rect x="490" y="510" width="300" height="55" fill="#B2C9AB" stroke="#999" stroke-width="1"/><text x="640" y="581" font-family="sans-serif" font-size="12" fill="#46495D" text-anchor="middle">one-code-wiki &amp;amp; one-code-wiki-cn&lt;br&gt;代码库 Wiki 增量摄入、检索与巡检 (ingest/query/lint，中英文双语支持)</text><rect x="490" y="590" width="300" height="55" fill="#B2C9AB" stroke="#999" stroke-width="1"/><text x="640" y="661" font-family="sans-serif" font-size="12" fill="#46495D" text-anchor="middle">one-wiki &amp;amp; one-wiki-cn&lt;br&gt;个人通用 Markdown 知识库处理体系 (ingest/query/lint，中英文双语支持)</text><rect x="490" y="670" width="300" height="55" fill="#B2C9AB" stroke="#999" stroke-width="1"/><text x="640" y="741" font-family="sans-serif" font-size="12" fill="#46495D" text-anchor="middle">one-build-mermaid &amp;amp; one-build-drawio&lt;br&gt;架构时序图/流程图与 Draw.io 可视化构建</text><rect x="490" y="750" width="300" height="55" fill="#B2C9AB" stroke="#999" stroke-width="1"/><text x="640" y="821" font-family="sans-serif" font-size="12" fill="#46495D" text-anchor="middle">one-code-map&lt;br&gt;代码库结构 MAP 索引初始化、增量更新与一致性巡检 (build/update/lint)</text><rect x="490" y="830" width="300" height="55" fill="#B2C9AB" stroke="#999" stroke-width="1"/><text x="640" y="901" font-family="sans-serif" font-size="12" fill="#46495D" text-anchor="middle">one-wsl-chrome&lt;br&gt;WSL 环境下通过 CDP 自动拉起与控制宿主机 Windows Chrome</text><rect x="490" y="910" width="300" height="55" fill="#B2C9AB" stroke="#999" stroke-width="1"/><text x="640" y="981" font-family="sans-serif" font-size="12" fill="#46495D" text-anchor="middle">install.sh &amp;amp; install-others.sh&lt;br&gt;交互式技能分发与部署安装/卸载体系</text></svg>